[build-system]
requires = ["setuptools>=77,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baroreflex-representation-pipeline"
version = "1.0.0"
description = "Reproducible pipeline for scalar and two-dimensional representations of baroreflex dynamics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Jose J.H. Galvez"},
  {name = "Jose J. Hernandez-Cabrera"},
  {name = "Jose Evora-Gomez"},
  {name = "Juan A. Montiel-Nelson"},
]
dependencies = [
  "matplotlib>=3.7",
  "neurokit2>=0.2.7",
  "numpy>=1.24",
  "pandas>=2.0,<3",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "tsfresh==0.21.2",
  "wfdb>=4.1",
  "pandas-stubs~=2.3.3",
]

[project.scripts]
baroreflex-pipeline = "baroreflex_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

